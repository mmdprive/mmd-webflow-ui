  function setLang(lang){
    if(!dict[lang])lang='th';
    root.querySelectorAll('[data-i18n]').forEach(el=>{const v=dict[lang][el.dataset.i18n];if(v!=null)el.textContent=v});
    root.querySelectorAll('[data-i18n-html]').forEach(el=>{const v=dict[lang][el.dataset.i18nHtml];if(v!=null)el.innerHTML=v});
    root.querySelectorAll('[data-blim-lang]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.blimLang===lang)));
    document.documentElement.lang=lang==='zh'?'zh-Hans':lang;try{localStorage.setItem('mmd_lang',lang)}catch(e){}
  }
  root.addEventListener('click',e=>{const b=e.target.closest('[data-blim-lang]');if(b)setLang(b.dataset.blimLang)});
  let initial='th';try{initial=new URLSearchParams(location.search).get('lang')||localStorage.getItem('mmd_lang')||'th'}catch(e){}setLang(initial);
  const items=[...root.querySelectorAll('.blim-reveal')];
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver'in window)){items.forEach(x=>x.classList.add('is-in'))}else{const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-in');io.unobserve(entry.target)}}),{threshold:.12,rootMargin:'0px 0px -40px'});items.forEach(x=>io.observe(x))}
  root.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const target=document.querySelector(a.getAttribute('href'));if(target){e.preventDefault();target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}));
  document.dispatchEvent(new CustomEvent('mmd:page:ready',{detail:{page:'believe-inme',build:root.dataset.build}}));
})();
