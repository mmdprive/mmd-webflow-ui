<script>
(()=>{const r=document.querySelector('#mmdCompanionV10');if(!r||r.dataset.ready)return;r.dataset.ready='1';const q=s=>[...r.querySelectorAll(s)],ok=['promo','src','campaign','invite','t'],sp=new URLSearchParams(location.search);q('a[href^="/"]').forEach(a=>{let u=new URL(a.getAttribute('href'),location.origin);ok.forEach(k=>{let v=sp.get(k);if(v)u.searchParams.set(k,v)});if(/^\/(booking|profiles)/.test(u.pathname)){u.searchParams.set('from','services_companion');if(u.pathname==='/booking')u.searchParams.set('service','companion')}a.href=u.pathname+'?'+u.searchParams});const setLang=l=>{if(!['th','en','zh'].includes(l))l='th';r.lang=l==='zh'?'zh-Hans':l;q('[data-th]').forEach(e=>{let v=e.dataset[l];if(v)e.textContent=v});q('[data-lang]').forEach(b=>b.classList.toggle('is-active',b.dataset.lang===l));try{localStorage.setItem('mmd_lang',l)}catch(e){}};q('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));let lang='th';try{lang=localStorage.getItem('mmd_lang')||'th'}catch(e){}setLang(lang);q('[data-filter]').forEach(b=>b.addEventListener('click',()=>{let f=b.dataset.filter;q('[data-filter]').forEach(x=>x.classList.toggle('is-active',x===b));q('.mc10-card').forEach(c=>c.hidden=f!=='all'&&!c.dataset.tags.split(' ').includes(f));let rail=r.querySelector('[data-rail]');if(rail)rail.scrollTo({left:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}));q('.mc10-faq').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)q('.mc10-faq[open]').forEach(x=>{if(x!==d)x.open=false})}));let rev=q('.mc10-reveal');if('IntersectionObserver'in window){let io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -4%'});rev.forEach(e=>io.observe(e))}else rev.forEach(e=>e.classList.add('is-in'));let dock=r.querySelector('.mc10-dock'),hero=r.querySelector('.mc10-hero');if(dock&&hero&&'IntersectionObserver'in window)new IntersectionObserver(es=>dock.classList.toggle('is-visible',!es[0].isIntersecting),{threshold:.05}).observe(hero);q('[data-track]').forEach(a=>a.addEventListener('click',()=>{window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'mmd_cta_click',page:'services_companion',cta:a.dataset.track,package:a.closest('[data-package]')?.dataset.package||null})}))})();
</script>
